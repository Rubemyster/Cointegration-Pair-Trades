name: Daily Pairs Screen

on:
  schedule:
    # Cron has no timezone/DST awareness, so we schedule both possible UTC
    # times for 16:48 Europe/London and let the guard step below pick the
    # right one for today's date. Whichever one is "wrong" just no-ops.
    - cron: '48 15 * * 1-5'  # 16:48 UK time when on BST (UTC+1)
    - cron: '48 16 * * 1-5'  # 16:48 UK time when on GMT (UTC+0)
  workflow_dispatch: {}  # adds a "Run workflow" button in the Actions tab, for manual testing

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check this is today's correct DST-adjusted slot
        id: dst_check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          target_utc=$(TZ=Europe/London date -d "today 16:48" -u +%H:%M)
          actual_utc=$(date -u +%H:%M)
          if [ "$target_utc" = "$actual_utc" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping -- this slot ($actual_utc UTC) isn't today's DST-adjusted 16:48 Europe/London target ($target_utc UTC)."
          fi

      - uses: actions/checkout@v4
        if: steps.dst_check.outputs.should_run == 'true'

      - uses: actions/setup-python@v5
        if: steps.dst_check.outputs.should_run == 'true'
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.dst_check.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Run screener
        if: steps.dst_check.outputs.should_run == 'true'
        run: python main.py

      - name: Email results
        if: steps.dst_check.outputs.should_run == 'true'
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python send_email.py

      - name: Upload output as artifact
        if: always() && steps.dst_check.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pairs-screen-output
          path: output/
          retention-days: 30
